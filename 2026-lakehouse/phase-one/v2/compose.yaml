name: lake-meetup-files-v2
services:
  postgres:
    image: postgres:17.6
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    environment:
      POSTGRES_DB: ${USER:-meetup}
      POSTGRES_USER: ${USER:-meetup}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./pg:/var/lib/postgresql/data:Z
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
